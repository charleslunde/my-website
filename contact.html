<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Charles Lunde</title>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<link rel="stylesheet" href="style.css">
<body>
<header>
    <div class="logo">Charles Lunde</div>
    <button class="menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="mymusic.html">My Music</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="header-right">
        <a href="https://www.google.com/?client=safari">GOOOOOOGLE</a>
    </div>
</header>  
<script>
  const header = document.querySelector("header");
  const toggle = document.querySelector(".menu-toggle");

  toggle.addEventListener("click", () => {
    const isOpen = header.classList.toggle("open");
    toggle.setAttribute("aria-expanded", isOpen);
  });
</script>
</body>
<main>
  <h1>Contact</h1>
  <p>Send me a message and I'll get back to you.</p>

  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <p style="display: none;">
      <label>Don't fill this out: <input name="bot-field"></label>
    </p>

    <p>
      <label for="name">Name</label><br>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">Your email</label><br>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="6" required></textarea>
    </p>

    <button type="submit">Send</button>
  </form>
</main>
</body>
</html>
